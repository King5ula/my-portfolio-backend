[project]
name = "my-portfolio-backend"
version = "2.0.0"
description = "Portfolio backend -- FastAPI + Pydantic: AI clone chat (OpenRouter) and contact email"
requires-python = ">=3.11"
# Keep in sync with requirements.txt, the pip-facing install path for local dev/CI/Render.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
